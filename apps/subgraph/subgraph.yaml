# Goldsky subgraph manifest for the Terreno pixel maps on base.
#
# All eight maps are separate UUPS proxies of the same Terreno implementation,
# so every dataSource shares one ABI + one mapping file. The frontend mapId is
# injected per contract via dataSource.context (read in the mapping with
# dataSource.context().getI32("mapId")).
#
# GENERATED — do not edit. Addresses come from maps.base.json, which must
# stay in sync with apps/web/src/lib/maps/contracts.ts (source of truth).
# Regenerate with: node scripts/gen-subgraph-yaml.js
specVersion: 1.0.0
description: Ownership, purchase history, earn/spend and analytics for Terreno on base
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Terreno0
    network: base
    context:
      mapId:
        type: Int
        data: 0
    source:
      address: "0x8db1EaAd99eF3a4c2AE4479D0570C00E12Be3f79" # 0 world
      abi: Terreno
      startBlock: 50404393
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Pixel
        - Owner
        - OwnerMapStat
        - PurchaseBatch
        - Purchase
        - OwnerProfile
        - Token
        - MapStat
        - ActiveBuyer
      abis:
        - name: Terreno
          file: ./abis/Terreno.json
      eventHandlers:
        - event: PixelsPurchased(indexed address,indexed address,uint256[],uint256)
          handler: handlePixelsPurchased
        - event: ProfileUpdated(indexed address,uint24,bytes,bytes)
          handler: handleProfileUpdated
        - event: AcceptedTokenAdded(indexed address,uint8)
          handler: handleAcceptedTokenAdded
        - event: AcceptedTokenRemoved(indexed address)
          handler: handleAcceptedTokenRemoved
        - event: FeeRateUpdated(uint256)
          handler: handleFeeRateUpdated
