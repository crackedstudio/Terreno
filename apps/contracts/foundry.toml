[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "broadcast" }, { access = "read", path = "map" }]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

[rpc_endpoints]
# Base is the deploy target: Nimiq Pay exposes Base to mini apps, and does not
# expose Celo. The contract itself is chain-agnostic — accepted tokens are
# constructor/initializer input, not hardcoded — so this is a redeploy, not a
# port. The Celo entries are kept so the original mainnet deployments stay
# reachable for reads/migration until they are retired.
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
celo = "${CELO_RPC_URL}"
celo_testnet = "${CELO_TESTNET_RPC_URL}"

# Source verification. Foundry knows Base's explorer endpoint; it only needs a
# key. A single Etherscan V2 key (etherscan.io) covers Base — a basescan.org key
# also works. Set ETHERSCAN_API_KEY in .env (auto-loaded) and run:
#
#   forge verify-contract <addr> src/Terreno.sol:Terreno --chain base --watch
#
# The proxy and the implementation are verified separately: verify the
# implementation for the source, then mark the proxy as a proxy on the explorer
# so it renders the implementation's read/write tabs.
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
